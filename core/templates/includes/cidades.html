{% load static %}
  <section id="cidades" class="py-5">
    <div class="container">
      <div class="text-center mb-5">
        <h2 class="fw-bold">Cidades Abrangidas</h2>
        <p class="text-muted">Onde atuamos em Rondônia.</p>
        <div class="row justify-content-center mt-3">
          <div class="col-md-6 text-center">
            <img src="{% static 'imgs/rondonia.jpg' %}" class="img-fluid rounded-3 shadow-sm w-100" style="object-fit:cover;max-height:320px" alt="Mapa de cidades abrangidas" />
          </div>
        </div>
      </div>
      <div class="row g-4">
      {% for m in municipios %}
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100 border-0 shadow-sm text-center py-4">
            <div class="card-body">
              <i class="bi bi-geo-alt-fill text-warning fs-1 mb-2 d-block"></i>
              <h5 class="fw-bold">{{ m.nome }}</h5>
              {% for c in m.campus.all %}
              <p class="text-muted small mb-0">{{ c.nome }}</p>
              {% endfor %}
            </div>
          </div>
        </div>
      {% endfor %}
      </div>
    </div>
  </section>
