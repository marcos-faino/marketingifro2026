{% load static %}
  <section id="servicos" class="py-5">
    <div class="container">
      <div class="text-center mb-5">
        <h2 class="fw-bold">Serviços Prestados</h2>
        <p class="text-muted">Tudo para conectar a comunidade ao IFRO.</p>
      </div>
      <div class="row g-4">
      {% for s in servicos %}
        <div class="col-md-6 col-lg-4">
        <a href="{% url 'servico_detalhe' s.id %}" class="text-decoration-none">
          <div class="card h-100 border-0 shadow-sm">
            <img src="{{ s.imagem.thumb.url }}" class="card-img-top" alt="{{ s.nome }}" />
            <div class="card-body">
              <h5 class="card-title"><i class="bi {{ s.icone }} text-warning me-2"></i>{{ s.nome }}</h5>
              <p class="card-text text-muted">{{ s.descricao|truncatewords:10 }}</p>
            </div>
          </div>
       </a>
        </div>
      {% endfor %}
      </div>
    </div>
  </section>
